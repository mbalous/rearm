name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell 5.1 tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run fixture tests
        shell: powershell
        run: .\Test-Rearm-E-SysLauncher.ps1
